<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kvittering</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 0; padding: 2rem; max-width: 60ch; }
</style>
</head>
<body>
  <h1>Tak — vi har din bestilling</h1>

  <!-- The defect this fixture exists for, copied in shape from the losing build in rendered
       pilot 02: an <li> inside a <dl>. axe reports it as dlitem and listitem, both serious.
       Nothing links here from the entry, so a gate that only measures the entry never sees
       it. -->
  <dl class="kvittering-readout">
    <li><dt>Sagsnummer</dt><dd>XX-2026-0001</dd></li>
    <li><dt>Pris</dt><dd>2.400 kr. ekskl. moms</dd></li>
  </dl>

  <p>Vi ringer inden for tre hverdage.</p>
</body>
</html>
