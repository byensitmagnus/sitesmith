<!--
name: empty-state
category: feedback
use: Any list, table or panel that can legitimately have nothing in it.
avoid: A loading state, that is a different component and a different message.
tokens: --space-2 --space-3 --space-4 --space-6 --line --line-2 --surface --surface-2
        --ink --ink-2 --accent --on-accent --text-small --text-body --radius-inner
        --radius-outer
prevents: The state every generated page forgets, and the one every real product
          hits on day one. Also the empty state that says "No data" and offers no
          way out, which is a dead end wearing a sentence.
-->
<style>
.block-empty-state{border:1px dashed var(--line-2);border-radius:var(--radius-outer);
  background:var(--surface);padding:var(--space-6) var(--space-4);text-align:center}
.block-empty-state__glyph{width:44px;height:44px;margin:0 auto var(--space-3);
  border-radius:var(--radius-inner);background:var(--surface-2);
  border:1px solid var(--line)}
.block-empty-state h3{margin:0;font-size:var(--text-body);color:var(--ink)}
/* The body says why it is empty and what would fill it. "No results" says neither. */
.block-empty-state p{margin:var(--space-2) auto 0;color:var(--ink-2);
  font-size:var(--text-small);max-width:42ch}
.block-empty-state__act{margin-top:var(--space-4);display:inline-flex;gap:var(--space-2);
  flex-wrap:wrap;justify-content:center}
.block-empty-state button{font:inherit;font-size:var(--text-small);font-weight:600;
  padding:var(--space-2) var(--space-4);border-radius:var(--radius-inner);cursor:pointer;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  transition:border-color var(--motion-fast) var(--ease)}
.block-empty-state button:hover{border-color:var(--ink-2)}
.block-empty-state button.primary{background:var(--accent);border-color:var(--accent);
  color:var(--on-accent)}
.block-empty-state button:active{transform:translateY(1px)}
.block-empty-state :focus-visible{outline:2px solid var(--accent);outline-offset:2px;
  border-radius:var(--radius-inner)}
</style>

<section class="block-empty-state" aria-labelledby="es2-h">
  <div class="block-empty-state__glyph" aria-hidden="true"></div>
  <h3 id="es2-h">No rules matched this week</h3>
  <p>
    Every entry in the queue was routed by hand. One rule for Northgate would have cleared
    61 of them.
  </p>
  <div class="block-empty-state__act">
    <button class="primary" type="button">Draft a rule from these rows</button>
    <button type="button">See how rules work</button>
  </div>
</section>
