name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  repo-check:
    name: repo structure, licences and search engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # One script, runnable locally with the same command. It covers the SKILL.md
      # line cap, the reference-map line counts, every relative markdown link, the
      # attribution header on all 46 bundled files, the '## Contents' rule, LICENSE
      # detectability, the plugin manifests, orphaned datasets, the counts quoted in
      # the docs, and a smoke test of every search domain, stack and design system.
      - run: python tools/check-repo.py

  benchmarks:
    name: benchmarks render and pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install
        working-directory: benchmarks
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: serve
        working-directory: benchmarks
        run: |
          # 4321 serves the benchmark set; 4322 serves the repository root so the
          # gallery's links to benchmarks/… resolve exactly as they do on Pages.
          node serve.mjs 4321 . &
          node serve.mjs 4322 .. &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4321/01-saas-landing/ >/dev/null \
              && curl -sf http://localhost:4322/ >/dev/null && break
            sleep 1
          done

      - name: nine builds must pass
        working-directory: benchmarks
        run: |
          for b in 01-saas-landing 02-product-page 03-dashboard 04-local-service 05-editorial \
                   06-redesign/after 07-multistep-form 08-documentation 09-data-entry; do
            echo "::group::$b"
            node ../skills/sitesmith/scripts/verify.mjs "http://localhost:4321/$b/" \
              --out "/tmp/$(echo $b | tr / -)"
            echo "::endgroup::"
          done

      # The gallery makes the claims, so it is held to them. This also catches a
      # thumbnail or a benchmark link that was renamed but not updated.
      - name: the gallery must pass its own script
        working-directory: benchmarks
        run: node ../skills/sitesmith/scripts/verify.mjs http://localhost:4322/ --out /tmp/gallery

      - name: control must keep failing
        working-directory: benchmarks
        run: |
          if node ../skills/sitesmith/scripts/verify.mjs \
               "http://localhost:4321/06-redesign/before/" --out /tmp/control; then
            echo "::error::The control page passed. It is the baseline and must keep its intentional defects — see benchmarks/README.md"
            exit 1
          fi
          echo "control failed as expected"

      # The exit contract is what CI and the skill both depend on. Each of these
      # three was broken at some point and none of them was visible in a passing run.
      - name: verify.mjs exit contract
        working-directory: benchmarks
        run: |
          V=../skills/sitesmith/scripts/verify.mjs
          set +e
          node $V --no-axe http://localhost:4321/01-saas-landing/ --out /tmp/c0 >/dev/null 2>&1
          [ $? -eq 0 ] || { echo "::error::switch before the URL should still parse the URL (expected exit 0)"; exit 1; }
          node $V http://localhost:4321/no-such-page/ --no-axe --out /tmp/c1 >/dev/null 2>&1
          [ $? -eq 1 ] || { echo "::error::an HTTP 404 must be a blocking failure (expected exit 1)"; exit 1; }
          # 4399 deliberately has no listener. Do not reuse 4321 or 4322 here —
          # both are served above, and a reachable port turns this into a no-op.
          node $V http://localhost:4399/ --out /tmp/c2 >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "::error::an unreachable server is a setup error, not a page defect (expected exit 2)"; exit 1; }
          node $V http://localhost:4321/01-saas-landing/ --widths nonsense --out /tmp/c3 >/dev/null 2>&1
          [ $? -eq 2 ] || { echo "::error::invalid --widths must exit 2"; exit 1; }
          echo "exit contract holds"
