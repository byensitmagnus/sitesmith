<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img"
     aria-labelledby="t-3s" fill="none" stroke="currentColor" stroke-width="1.4">
  <title id="t-3s">Cross-section of three-strand rope: three helical strands laid around each other</title>
  <!-- Drawn for Trelfall & Son. Three strands, right-hand lay, each strand itself a bundle
       of twisted yarns. The lay is what a buyer looks at first: it tells them the rope can
       be spliced by hand and that it will rotate under load. -->
  <circle cx="60" cy="60" r="48" stroke-dasharray="3 4" opacity=".45"/>
  <g>
    <circle cx="60" cy="33" r="26"/>
    <circle cx="37" cy="73" r="26"/>
    <circle cx="83" cy="73" r="26"/>
  </g>
  <g stroke-width=".8" opacity=".7">
    <!-- yarn twist inside each strand -->
    <path d="M42 27q18 -9 36 0M40 33q20 -9 40 0M40 39q20 -9 40 0M42 45q18 -9 36 0"/>
    <path d="M19 67q18 -9 36 0M17 73q20 -9 40 0M17 79q20 -9 40 0M19 85q18 -9 36 0"/>
    <path d="M65 67q18 -9 36 0M63 73q20 -9 40 0M63 79q20 -9 40 0M65 85q18 -9 36 0"/>
  </g>
  <path d="M60 8v-6M108 84l5 3M12 84l-5 3" stroke-width="1" opacity=".5"/>
</svg>
