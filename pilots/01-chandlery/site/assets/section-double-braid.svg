<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img"
     aria-labelledby="t-db" fill="none" stroke="currentColor" stroke-width="1.4">
  <title id="t-db">Cross-section of double-braid rope: a braided core inside a braided cover</title>
  <!-- Drawn for Trelfall & Son. The cover carries roughly half the load and all of the
       abrasion; the core carries the rest. A buyer checks this construction when the rope
       will run over a winch: a double braid does not rotate and does not hockle. -->
  <circle cx="60" cy="60" r="52"/>
  <circle cx="60" cy="60" r="40"/>
  <circle cx="60" cy="60" r="30" stroke-width="1.1"/>
  <!-- cover braid: opposing diagonals in the annulus -->
  <g stroke-width=".8" opacity=".75" clip-path="url(#cover)">
    <path d="M-10 4l140 140M-10 24l140 140M-10 44l140 140M-10 64l140 140M-10 84l140 140M-10 -16l140 140M-10 -36l140 140"/>
    <path d="M130 4L-10 144M130 24L-10 164M130 44L-10 184M130 64L-10 204M130 -16L-10 124M130 -36L-10 104M130 -56L-10 84"/>
  </g>
  <clipPath id="cover"><path d="M60 8a52 52 0 110 104 52 52 0 110-104zm0 12a40 40 0 100 80 40 40 0 100-80z" clip-rule="evenodd"/></clipPath>
  <!-- core: parallel-ish braided bundle, drawn tighter -->
  <g stroke-width=".8" opacity=".6">
    <path d="M34 48q26 -12 52 0M32 56q28 -12 56 0M32 64q28 -12 56 0M34 72q26 -12 52 0"/>
  </g>
</svg>
