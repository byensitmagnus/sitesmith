<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 250" role="img" aria-labelledby="bp">
  <title id="bp">Half-section of a bell from crown to lip, with the five partials marked at
    the heights they sound from</title>
  <!-- Drawn for Marrow &amp; Kell. A bell cannot be photographed usefully: from the ground you
       see the underside, from the chamber you see the frame. The half-section is what the
       trade draws, and it is the only view in which the profile — the thing that makes one
       founder's bell sound unlike another's — is visible at all. The wall thickening into
       the soundbow is the point of the drawing: that is where the note comes from. -->
  <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
    <path d="M60 12v230" stroke-dasharray="6 6" stroke-width="1" opacity=".45"/>
    <path d="M64 20c0-6 4-9 8-9s8 3 8 9"/>
    <path d="M60 20h22c14 3 20 17 23 47 3 30 6 62 12 90 5 23 15 40 28 55v10H121
             c-10-14-17-31-21-52-5-27-8-58-11-86-2-22-8-32-29-33z"
          fill="currentColor" fill-opacity=".13"/>
    <g stroke-width="1" stroke-dasharray="2 3" opacity=".8">
      <path d="M60 222h96M60 186h84M60 140h64M60 92h50M60 50h38"/>
    </g>
  </g>
  <g fill="currentColor" font-family="ui-monospace,'SF Mono',monospace" font-size="8.5"
     letter-spacing=".1em" opacity=".95">
    <text x="160" y="225">HUM</text>
    <text x="148" y="189">PRIME</text>
    <text x="128" y="143">TIERCE</text>
    <text x="114" y="95">QUINT</text>
    <text x="102" y="53">NOMINAL</text>
  </g>
</svg>
