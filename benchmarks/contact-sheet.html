<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>sitesmith benchmarks</title>
<style>
body{margin:0;background:#0f0f10;color:#e8e6e1;font:14px/1.5 ui-sans-serif,system-ui,sans-serif;padding:28px}
h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
p.s{margin:0 0 22px;color:#8b8880;font-size:13px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
figure{margin:0;background:#171718;border:1px solid #2a2a2c;border-radius:8px;overflow:hidden}
.f{height:420px;overflow:hidden;background:#fff;display:block}
.f img{width:100%;display:block}
figcaption{padding:9px 12px;font-size:12px;color:#a5a29a;border-top:1px solid #2a2a2c;display:flex;gap:8px}
figcaption b{color:#e8e6e1;font-weight:600}
figcaption .t{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px}
.pass{color:#7ddc9a}.fail{color:#ff8b6b}
</style></head><body>
<h1>sitesmith — six benchmark sites, one control</h1>
<p class="s">Each built from a different brief with the same skill. Top 420px at 1440 wide.</p>
<div class="g">
  <figure><span class="f"><img src="results/01-saas-landing/1440.png" alt="SaaS landing page"></span>
    <figcaption><b>01</b> SaaS landing <span class="t pass">PASS</span></figcaption></figure>
  <figure><span class="f"><img src="results/02-product-page/1440.png" alt="Gaming PC product page"></span>
    <figcaption><b>02</b> Product page <span class="t pass">PASS</span></figcaption></figure>
  <figure><span class="f"><img src="results/03-dashboard/1440.png" alt="Reconciliation dashboard"></span>
    <figcaption><b>03</b> Dashboard <span class="t pass">PASS</span></figcaption></figure>
  <figure><span class="f"><img src="results/04-local-service/1440.png" alt="Local roofing business site"></span>
    <figcaption><b>04</b> Local service <span class="t pass">PASS</span></figcaption></figure>
  <figure><span class="f"><img src="results/05-editorial/1440.png" alt="Sound designer portfolio"></span>
    <figcaption><b>05</b> Editorial <span class="t pass">PASS</span></figcaption></figure>
  <figure><span class="f"><img src="results/06-redesign-after/1440.png" alt="Redesigned scheduling landing page"></span>
    <figcaption><b>06</b> Redesign, after <span class="t pass">PASS</span></figcaption></figure>
  <figure><span class="f"><img src="results/06-redesign-before/1440.png" alt="Deliberately generic control page"></span>
    <figcaption><b>—</b> Control, before <span class="t fail">FAIL</span></figcaption></figure>
</div>
</body></html>
