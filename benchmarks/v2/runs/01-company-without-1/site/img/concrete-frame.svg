<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="Line elevation of a 1960s concrete-frame office block with a curtain-walled grid facade">
  <style>
    .ln { fill: none; stroke: #15171a; stroke-width: 1.3; stroke-linecap: square; }
    .hair { fill: none; stroke: #15171a; stroke-width: .7; opacity: .5; }
    .fill { fill: #15171a; opacity: .07; }
    .gnd { fill: none; stroke: #8c3a1f; stroke-width: 1.6; }
    @media (prefers-color-scheme: dark) {
      .ln, .hair { stroke: #e9e6de; }
      .fill { fill: #e9e6de; }
      .gnd { stroke: #e08c66; }
    }
  </style>

  <!-- roof plant -->
  <path class="ln" d="M150 40h80v22h-80z"/>
  <path class="hair" d="M158 46h64M158 52h64M158 58h64"/>

  <!-- parapet -->
  <path class="ln" d="M44 62h312v10H44z"/>
  <path class="fill" d="M44 62h312v10H44z"/>

  <!-- main frame -->
  <path class="ln" d="M52 72h296v142H52z"/>

  <!-- floor spandrels -->
  <path class="fill" d="M52 110h296v10H52zM52 158h296v10H52zM52 206h296v8H52z"/>
  <path class="ln" d="M52 110h296M52 120h296M52 158h296M52 168h296M52 206h296"/>

  <!-- mullions -->
  <g class="hair">
    <path d="M76 72v142M100 72v142M124 72v142M148 72v142M172 72v142M196 72v142M220 72v142M244 72v142M268 72v142M292 72v142M316 72v142"/>
  </g>

  <!-- expressed frame columns -->
  <g class="ln">
    <path d="M124 72v142M196 72v142M268 72v142"/>
  </g>

  <!-- recessed ground storey -->
  <path class="hair" d="M64 222h272v46H64z"/>
  <g class="hair">
    <path d="M92 222v46M120 222v46M148 222v46M176 222v46M204 222v46M232 222v46M260 222v46M288 222v46M316 222v46"/>
  </g>

  <!-- pilotis -->
  <g class="ln">
    <path d="M60 214h12v56H60zM136 214h12v56h-12zM212 214h12v56h-12zM288 214h12v56h-12zM328 214h12v56h-12z"/>
  </g>

  <!-- entrance canopy -->
  <path class="ln" d="M160 232h80v6h-80z"/>

  <!-- ground line -->
  <path class="gnd" d="M14 270h372"/>
</svg>
