<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"
     aria-label="Line elevation of a retail park terrace with a fascia sign band, canopy and parking bays">
  <style>
    .ln { fill: none; stroke: #15171a; stroke-width: 1.3; stroke-linecap: square; }
    .hair { fill: none; stroke: #15171a; stroke-width: .7; opacity: .5; }
    .fill { fill: #15171a; opacity: .07; }
    .gnd { fill: none; stroke: #8c3a1f; stroke-width: 1.6; }
    @media (prefers-color-scheme: dark) {
      .ln, .hair { stroke: #e9e6de; }
      .fill { fill: #e9e6de; }
      .gnd { stroke: #e08c66; }
    }
  </style>

  <!-- roof / mono pitch -->
  <path class="ln" d="M28 104 372 92"/>
  <path class="ln" d="M28 104h344v128H28z"/>

  <!-- fascia sign band -->
  <path class="fill" d="M28 104h344v34H28z"/>
  <path class="ln" d="M28 138h344"/>
  <path class="hair" d="M52 114h58v14H52zM150 114h58v14h-58zM248 114h58v14h-58z"/>

  <!-- unit divisions -->
  <path class="ln" d="M142 138v94M256 138v94"/>

  <!-- profiled cladding -->
  <g class="hair">
    <path d="M46 138v18M64 138v18M82 138v18M100 138v18M118 138v18M160 138v18M178 138v18M196 138v18M214 138v18M232 138v18M274 138v18M292 138v18M310 138v18M328 138v18M346 138v18"/>
  </g>

  <!-- canopy -->
  <path class="ln" d="M20 166h360v10H20z"/>
  <g class="ln">
    <path d="M34 176v56M142 176v56M256 176v56M366 176v56"/>
  </g>

  <!-- shopfront glazing -->
  <path class="hair" d="M40 182h96v50H40zM152 182h96v50h-96zM266 182h96v50h-96z"/>
  <g class="hair">
    <path d="M64 182v50M88 182v50M112 182v50M176 182v50M200 182v50M224 182v50M290 182v50M314 182v50M338 182v50"/>
  </g>

  <!-- ground line -->
  <path class="gnd" d="M14 232h372"/>

  <!-- parking bays -->
  <g class="hair">
    <path d="M40 246h48v34H40zM96 246h48v34H96zM152 246h48v34h-48zM208 246h48v34h-48zM264 246h48v34h-48z"/>
  </g>
</svg>
